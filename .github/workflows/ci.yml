name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build the app
        run: ./scripts/build-app.sh
      - name: Upload Mamute.zip
        uses: actions/upload-artifact@v4
        with:
          name: Mamute
          path: build/Mamute.zip
